# ======================================================================================================= #

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ======================================================================================================= #

[project]
name = "LoRA-Sec"
version = "1.0.0"
description = "Federated Learning"
license = "Apache-2.0"
authors = [
    { name = "1", email = "1@1.gmail.com" },
    { name = "-", email = "-" },
]
dependencies = [
    "flwr[simulation]==1.12.0",
    "flwr-datasets>=0.3.0",
    "torch==2.4.0",
    "transformers>=4.30.0,<5.0",
    "evaluate>=0.4.0,<1.0",
    "datasets>=2.0.0, <3.0",
    "scikit-learn>=1.3.1, <2.0",
]

# ======================================================================================================= #

[tool.hatch.build.targets.wheel]
packages = ["."]

# ======================================================================================================= #

[tool.flwr.app]
publisher = "flwrlabs"

# ======================================================================================================= #

[tool.flwr.app.components]
serverapp = "LoRA_Sec.server_app:app"
clientapp = "LoRA_Sec.client_app:app"

# ======================================================================================================= #

[tool.flwr.app.config]

# ======================================================================================================= # 
# ===================================== Config of Federated Learning ==================================== #

num-server-rounds = 200        

fraction-fit =  0.8

fraction-evaluate = 1
eval_window_rounds = 200       
eval_last_k_in_window = 11    

number_of_clients = 20

base_seed = 1807551

# ----------------- Orthogonality Regularization ----------------- #

# use_ortho_loss = false
# lambda_ortho = 0             

use_ortho_loss = true
lambda_ortho = 0.4                 #  For Classification: 0.4   --   For QA: 0.02

# ======================================================================================================= # 
# ============================================ Dataset and Model ======================================== #

# Uncomment the block corresponding to the dataset you want to use:

# ------------------------------------------------
# --------------------- SWAG ---------------------

# partitioner_type = "Dirichlet"     
# partitioner_parameter = 0.5             

# problem_type = "mc_qa"                  # "seq_cls"  (Text Classification)   ,  "qa"  (Extractie Question Answering) , "mc_qa" (Multiple Choice Question Answering)
# dataset_name = "SWAG"                   # "SWAG"
# num_labels = 0                              
# number_of_samples = 10000               # 0 or negative => use full dataset  
# learning_rate = 1e-5                    

# model-name = "google/electra-small-discriminator"        

# ------------------------------------------------
# -------------------- PIQA ---------------------

# partitioner_type = "Dirichlet"     
# partitioner_parameter = 0.5             

# problem_type = "mc_qa"                  # "seq_cls"  (Text Classification)   ,  "qa"  (Extractie Question Answering) , "mc_qa" (Multiple Choice Question Answering)
# dataset_name = "PIQA"                   # "PIQA"     
# num_labels = 0                           
# number_of_samples = 10000               # 0 or negative => use full dataset  
# learning_rate = 4e-4                    

# model-name = "google/electra-small-discriminator"        

# ------------------------------------------------
# ----------------- IMDB | DBPedia --------------

partitioner_type = "Dirichlet"     
partitioner_parameter = 0.5            

problem_type = "seq_cls"                   
dataset_name = "IMDB"                    # "IMDB", "DBPedia"      
num_labels = 2                           # IMDB = 2 , DBPedia = 14   
number_of_samples = 10000                # 0 or negative => use full dataset 
# learning_rate = 5e-5                   # 5e-5 for IMDB, DBPedia 
learning_rate = 5e-5  # IMDB

model-name = "prajjwal1/bert-tiny"          


# ======================================================================================================= # 
# ============================================== Attack Config ========================================== #

# Uncomment the attack configuration (One of Attack or No Attack):

# ------------------------------------------------
# -------------------- Attack---------------------

attack_type = "Trim"                   # RandScaling, MinMax, MinSum, Trim, PoisonedFL, FedIMP, Mixture, SOPTrim  ---- SOPRandScaling, SOPMinMax, SOPPoisonedFL
Malicious-Client-Percentage = 0.4                 

# ------------------------------------------------
# ------------------- No Attack ------------------

# attack_type = "NoAttack"                   
# Malicious-Client-Percentage = 0    

# ------------------------------------------------------------------ #
# ----------------------- For PoisonedFL attack -------------------- #

pfl_c0    = 8.0     # initial c
pfl_beta  = 0.7     # multiplicative decay when test fails
pfl_e     = 50      # window length for the binomial test
pfl_min_c = 0.5     # floor for c
pfl_pval  = 0.01    # significance level for the binomial test

# ------------------------------------------------------------------ #
# ----------------- FedIMP (Parameter-Importance MP) --------------- #

fedimp_importance = "fisher"               # "fisher" | "grad2" (alias)
fedimp_topk_ratio = 0.10                   # fraction of targeted coords to emphasize
fedimp_scale = 5.0                         # multiplicative boost on selected coords (gamma)
fedimp_flip_sign = false                   # reverse sign on selected coords (stronger untargeted damage)
fedimp_noise_std = 0.0                     # small Gaussian noise for stealth
fedimp_match_norm = false                  # rescale forged delta to benign L2 norm
fedimp_use_lora_only = true                # focus on LoRA A/B by default
fedimp_include_classifier = false          # optionally include classifier head
fedimp_fisher_batches = 2                  # #mini-batches to estimate diagonal Fisher
fedimp_fisher_batchsize = 16               # batch size for Fisher probe

fedimp_num_sims = 6                        # K: how many benign simulations per round
fedimp_sim_batches = 2                     # small #batches per simulation (not full epoch)
fedimp_delta_max = 10.0                    # δ_max for pre-poison and binary search upper bound
fedimp_tau = 1e-3                          # binary-search tolerance on δ
fedimp_eps = 0.0                           # slack in acceptance inequality
fedimp_prepoison_jump = 0.02               # if (l1 - l0) > this, keep δ_max (pre-poison)
fedimp_share_across_malicious = true       # make all compromised clients upload identical Δw
fedimp_shared_dir = "./.fedimp_shared"     # where to share per-round vectors (local sim)
fedimp_leader_cid = "0"                    # who computes (μ,σ,mask) and saves (others load)

# ------------------------------------------------------------------ #
# -------------------- SOP stealth-target settings ----------------- #

# Retained because the SOP attacks use these values.

adaptive_ortho_target_offset = 0.0
adaptive_ortho_search_iters = 10

# ------------------------------------------------------------------ #
# ---------------------------- Mixture attack ---------------------- #

mixture_choices = "ALL"      # or: "RandScaling, Trim, MinMax, MinSum, PoisonedFL, FedIMP"
mixture_seed = 1337

# ======================================================================================================= # 
# ============================================== Defense Config ========================================= # 

# Defense choices: FedAvg, IdealDefense, Krum, MultiKrum, TrimmedMean, FLTrust, DnC, FoolsGold, FedDMC, ShieldFL, ORLA, ORLA-Flex,
#
# Ablations: ORLA-ablation1, ORLA-ablation2, ORLA-ablation3, ORLA-ablation4, ORLA-ablation5, ORLA-ablation6, ORLA-ablation7.
#
# ORLA: Full three-stage defense (formerly ORLA-v9A6).
# ORLA-ablation1: Replace Stage 1 orthogonality ranking with deterministic random ranking; keep the same per-round removal quota.
# ORLA-ablation2: Disable Stage 2 singular-value-spread detection.
# ORLA-ablation3: Disable Stage 3 effective-BA distance safety gate and cap.
# ORLA-ablation4: Disable early-round Stage 3 bootstrap detection.
# ORLA-ablation5: Disable Stage 3 soft influence capping of selected clients.
# ORLA-ablation6: Disable the extreme-BA-residual cap-eligibility extension; preserve the ordinary influence-cap mechanism.
# ORLA-ablation7: Stage 3 only. Reject the fixed fraction with largest effective B@A update distance; no Stage 1/2 scores.
#                
# ORLA-Flex:      Full ORLA Stages 2/3 with an adaptive Stage 1 cutoff chosen from the largest legal orthogonality-score gap.
#            

strategy = "ORLA"

# Each defense reads only its own parameter(s). You may change only `strategy` above; these defaults are used automatically when a key is omitted.
# FedAvg, Krum, FLTrust, IdealDefense, FedDMC and ShieldFL do not need a shared strategy_parameter. Krum derives f from selected malicious clients.

multikrum_m = 6                    # Number of MultiKrum winners (m).
multikrum_f = 6                    # Initial Byzantine bound (f); existing per-round logic updates f.
trimmed_mean_trim_ratio = 0.4      # Fraction trimmed from EACH tail in TrimmedMean.
dnc_trim_ratio = 0.4               # Fraction of highest-scoring updates rejected by DnC.
orla_removal_ratio = 0.4           # ORLA and ablations 1-7: fraction rejected each round.
orla_flex_min_retained = 6         # ORLA-Flex: minimum clients retained in Stage 1.


# ------------------------------------------------------------------ #
# ------------------------- For FedDMC Defense --------------------- #

# FedDMC (PCA + BTBCN + SEDC)
feddmc_k = 10                      # PCA dims (paper discusses varying k; lower k -> faster & clearer separation)
feddmc_min_cluster_size = 3        # pruning threshold in BTBCN (paper’s fig. shows small values effective)
feddmc_alpha = 0.7                 # EMA memory for SEDC; higher remembers history more
feddmc_threshold = 0.5             # recommended in paper
feddmc_use_lora_only = true        # align with LoRA-delta setting
feddmc_include_classifier = false

# ======================================================================================================= # 
# ======================================================================================================= # 

[tool.flwr.federations]
default = "local-simulation"

# ======================================================================================================= #

[tool.flwr.federations.local-simulation]
options.num-supernodes = 20  

# ======================================================================================================= #

[tool.flwr.federations.local-simulation-gpu]
options.num-supernodes = 20  
options.backend.client-resources.num-cpus = 4      # each ClientApp assumes to use 4CPUs
options.backend.client-resources.num-gpus = 0.5    # at most 4 ClientApp will run in a given GPU (lower it to increase parallelism)

# ======================================================================================================= #
